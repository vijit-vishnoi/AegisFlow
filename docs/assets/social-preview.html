<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AegisFlow social preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 46% 54%;
      color: #f0f4fa;
      background: #080d16;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .copy {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 70px 20px 70px 76px;
      border-right: 1px solid #26344a;
    }
    .brand {
      margin: 0 0 24px;
      font-size: 74px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 760;
    }
    .brand span { color: #59a4ff; }
    .tagline {
      max-width: 490px;
      margin: 0;
      color: #b8c4d5;
      font-size: 27px;
      line-height: 1.42;
      letter-spacing: 0;
    }
    .decisions { display: flex; gap: 12px; margin-top: 38px; }
    .decision {
      padding: 9px 15px;
      border: 1px solid #33445e;
      border-radius: 6px;
      background: #101825;
      font: 700 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0;
    }
    .allow { color: #5ee39a; }
    .review { color: #ffd25f; }
    .block { color: #ff6f72; }
    .proof {
      position: relative;
      overflow: hidden;
      background: #0b1220;
    }
    .proof img {
      position: absolute;
      top: 64px;
      left: 35px;
      width: 925px;
      max-width: none;
      border: 1px solid #30415c;
      border-radius: 8px;
      box-shadow: 0 24px 70px rgb(0 0 0 / 45%);
    }
    .proof::after {
      content: "LIVE APPROVAL QUEUE";
      position: absolute;
      right: 24px;
      bottom: 22px;
      padding: 8px 12px;
      color: #9fb2cb;
      background: #0b1220;
      border: 1px solid #30415c;
      border-radius: 5px;
      font: 700 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main class="copy">
    <h1 class="brand">Aegis<span>Flow</span></h1>
    <p class="tagline">Local-first policy gateway for coding agents and MCP tools.</p>
    <div class="decisions" aria-label="Policy decisions">
      <span class="decision allow">ALLOW</span>
      <span class="decision review">REVIEW</span>
      <span class="decision block">BLOCK</span>
    </div>
  </main>
  <section class="proof" aria-label="AegisFlow approval queue">
    <img src="shot-approval-queue.png" alt="AegisFlow approval queue showing one pending GitHub pull request action">
  </section>
</body>
</html>
